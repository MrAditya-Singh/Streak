# ==============================================================================
# ⚡ EffStreak Production Nginx Reverse Proxy Configuration
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression for blazing fast load times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    upstream backend_nodes {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost 192.168.0.122;

        # Frontend Static Distribution
        location / {
            root   html; # or path/to/EffectiveStreak/dist
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Backend API Proxy
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time Server-Sent Events (SSE) Streaming
        location /api/sync/events {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
            add_header Cache-Control "no-cache";
            add_header X-Accel-Buffering "no";
        }

        # Error Pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
