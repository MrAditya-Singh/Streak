[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=19,24,34,230

[Metadata]
Name=EffStreak Desktop Widget
Author=EffStreak Team
Information=Cross-device gamified streak & consistency desktop widget for Windows
Version=1.0.0
License=MIT

[Variables]
FontName=Segoe UI
FontHeading=Segoe UI Black
ColorPrimary=255,255,255,255
ColorSecondary=148,163,184,255
ColorGreen=88,204,2,255
ColorOrange=255,92,0,255
ColorCard=22,27,38,200

; --- BACKGROUND CARD WITH ROUNDED CORNERS ---
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,280,340,16 | Fill Color 19,24,34,240 | StrokeWidth 1 | Stroke Color 255,255,255,25

; --- TOP STREAK HEADER ---
[MeterFlameIcon]
Meter=String
Text="🔥"
FontSize=18
X=18
Y=16

[MeterOverallStreak]
Meter=String
Text="97 DAY STREAK"
FontFace=#FontHeading#
FontSize=14
FontColor=#ColorOrange#
X=46
Y=18
AntiAlias=1

[MeterMotto]
Meter=String
Text="Keep going, Eren! 💪"
FontFace=#FontName#
FontSize=9
FontColor=#ColorSecondary#
X=18
Y=44
AntiAlias=1

; --- PLATFORM STREAKS ROW ---
[MeterPlatformCard1]
Meter=Shape
Shape=Rectangle 18,68,54,42,8 | Fill Color 10,14,20,180 | StrokeWidth 1 | Stroke Color 255,255,255,15
LeftMouseUpAction=["https://leetcode.com"]

